name: Bug Report
description: Report a bug in Forge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug. Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Start server with `make dev`
        2. Create a task via `forge-ctl task create ...`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include logs, error messages, or screenshots if possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Forge Version
      description: What version of Forge are you running?
      placeholder: "0.1.0 or commit hash"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, and any other relevant details.
      placeholder: "macOS 15, Rust 1.85, Node 24"
