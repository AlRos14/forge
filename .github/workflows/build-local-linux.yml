name: Build local Linux bundle

on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run focused Rust and web checks on GitHub
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check web
        if: inputs.run_checks
        working-directory: web
        run: |
          pnpm lint
          pnpm test
      - name: Browser smoke
        if: inputs.run_checks
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e
      - name: Build binaries
        env:
          FORGE_SKIP_WEB_BUILD: '1'
        run: cargo build --locked -p forge-cli -p forge-client
      - name: Package
        run: |
          mkdir -p bundle/web
          cp target/debug/forge target/debug/forge-ctl bundle/
          cp -R web/dist bundle/web/dist
          git rev-parse HEAD > bundle/SOURCE_REVISION
          tar -czf forge-linux-x86_64.tar.gz -C bundle .
          sha256sum forge-linux-x86_64.tar.gz > forge-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: forge-linux-x86_64
          path: |
            forge-linux-x86_64.tar.gz
            forge-linux-x86_64.tar.gz.sha256
          retention-days: 7

  rust-checks:
    if: inputs.run_checks
    runs-on: ubuntu-latest
    env:
      FORGE_SKIP_WEB_BUILD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked -p services -p db -p cli-adapters -p api -p api-types -p executors --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p cli-adapters --lib
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p services --lib orchestrator_runtime
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p services --lib task_coordination
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p services --lib coordination_auto_completion
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p services --test task_coordination
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p db --lib pr6_
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p db --test pr2_execution_session --test pr5_workunit --test task_coordination_schema --test file_backed_migration --test task_delete_integrity
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p api --test task_rework --test task_autonomy --test task_dispatch --test work_unit_reviews --test work_unit_artifact_package --test happy_path
