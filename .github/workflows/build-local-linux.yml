name: Build local Linux bundle

on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run focused Rust and web checks on GitHub
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check web
        if: inputs.run_checks
        working-directory: web
        run: |
          pnpm lint
          pnpm test
      - name: Build binaries
        env:
          FORGE_SKIP_WEB_BUILD: '1'
        run: cargo build --locked -p forge-cli -p forge-client
      - name: Package
        run: |
          mkdir -p bundle/web
          cp target/debug/forge target/debug/forge-ctl bundle/
          cp -R web/dist bundle/web/dist
          git rev-parse HEAD > bundle/SOURCE_REVISION
          tar -czf forge-linux-x86_64.tar.gz -C bundle .
          sha256sum forge-linux-x86_64.tar.gz > forge-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: forge-linux-x86_64
          path: |
            forge-linux-x86_64.tar.gz
            forge-linux-x86_64.tar.gz.sha256
          retention-days: 7

  rust-checks:
    if: inputs.run_checks
    runs-on: ubuntu-latest
    env:
      FORGE_SKIP_WEB_BUILD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p db
      - run: cargo test --locked -p cli-adapters --lib
      - run: cargo test --locked -p services --lib
      - run: cargo test --locked -p api --test task_rework --test task_dispatch --test task_autonomy --test happy_path
