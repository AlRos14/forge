name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: forge-x86_64-linux
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: forge-aarch64-linux
            builder: cargo
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: forge-x86_64-linux-musl
            builder: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: forge-aarch64-linux-musl
            builder: cross
          # One macOS runner builds both Apple targets: x86_64 is a cross
          # target on the arm64 runner, and a second macOS job was repeatedly
          # left without a hosted runner.
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: forge-aarch64-macos
            builder: cargo
            extra_target: x86_64-apple-darwin
            extra_artifact: forge-x86_64-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra_target && format('{0},{1}', matrix.target, matrix.extra_target) || matrix.target }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        working-directory: web
        run: pnpm build

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build forge binary
        env:
          FORGE_SKIP_WEB_BUILD: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: ${{ matrix.builder }} build -p forge-cli --release --target ${{ matrix.target }}

      - name: Build forge-ctl binary
        env:
          FORGE_SKIP_WEB_BUILD: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: ${{ matrix.builder }} build -p forge-client --release --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p dist/web
          cp target/${{ matrix.target }}/release/forge dist/
          cp target/${{ matrix.target }}/release/forge-ctl dist/
          cp -R web/dist dist/web/dist
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist forge forge-ctl web

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Build extra target binaries
        if: matrix.extra_target
        env:
          FORGE_SKIP_WEB_BUILD: "1"
        run: |
          cargo build -p forge-cli --release --target ${{ matrix.extra_target }}
          cargo build -p forge-client --release --target ${{ matrix.extra_target }}

      - name: Package extra target binaries
        if: matrix.extra_target
        run: |
          rm -rf dist-extra
          mkdir -p dist-extra/web
          cp target/${{ matrix.extra_target }}/release/forge dist-extra/
          cp target/${{ matrix.extra_target }}/release/forge-ctl dist-extra/
          cp -R web/dist dist-extra/web/dist
          tar -czf ${{ matrix.extra_artifact }}.tar.gz -C dist-extra forge forge-ctl web

      - name: Upload extra target artifact
        if: matrix.extra_target
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.extra_artifact }}
          path: ${{ matrix.extra_artifact }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          # download-artifact nests files as artifacts/<name>/<name>.tar.gz; flatten
          # so SHA256SUMS lists clean filenames that match what users download from
          # the release page (`sha256sum -c SHA256SUMS` works against downloaded files).
          mkdir -p release-files
          find artifacts -name '*.tar.gz' -type f -exec cp {} release-files/ \;
          cd release-files && sha256sum *.tar.gz > ../SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            SHA256SUMS

  container:
    name: Publish GHCR Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `latest` is added automatically for stable semver tags only —
          # pre-releases like v0.1.1-rc.1 correctly skip it.

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
