name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  documentation-contract:
    name: Documentation Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Getting Started WorkUnit order
        run: python3 scripts/check-getting-started-order.py

  rust-scope:
    name: Rust CI scope
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Detect an explicitly scoped security dependency update
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject="$(git log -1 --format=%s HEAD)"
          if [[ "$subject" != *"[skip-rust]"* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          if ((${#changed[@]} == 0)); then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.toml|Cargo.lock|CHANGELOG.md|.github/workflows/ci.yml|vendor/sqlx-sqlite/*) ;;
              *)
                echo "skip=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done

          echo "skip=true" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: rust-scope
    if: needs.rust-scope.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Rust CI
        run: ./scripts/ci-rust.sh

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  web:
    name: Web
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Playwright smoke
        run: pnpm run e2e

  npm-bootstrapper:
    name: Upstream npm Bootstrapper Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Syntax check
        run: node --check npx-cli/bin/cli.js

      - name: Pack dry run
        working-directory: npx-cli
        run: npm pack --dry-run
