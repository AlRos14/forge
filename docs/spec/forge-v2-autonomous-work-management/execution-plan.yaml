spec_version: 1
project:
  id: forge-v2-autonomous-work-management
  title: Forge V2 — Autonomous Work Management
  repository: ForgeAILab/forge
  default_workflow: autonomous_v1
  principles:
  - one primary agent per task by default
  - many tasks in parallel
  - external Forge validation
  - risk- and exception-driven human attention
  - task survives runs and agents
  - advanced workflow engine retained
milestones:
- id: M0
  title: Baseline and decisions
  goal: Protect existing behavior and establish safety dependencies.
- id: M1
  title: Workflow foundation
  goal: Introduce canonical phases and the one-worker autonomous preset.
- id: M2
  title: Global work surfaces
  goal: Create Home, Work, and user-oriented navigation.
- id: M3
  title: Task and review experience
  goal: Simplify task creation, task detail, runs, checks, and delivery review.
- id: M4
  title: Contracts and validation
  goal: Add enforceable task contracts, project policy, and validation profiles.
- id: M5
  title: Risk and escalation
  goal: Make gates, reviewer agents, recovery, and transfer conditional and auditable.
- id: M6
  title: Agent and runtime simplification
  goal: Present agents as teammates and runtime infrastructure as automatic compute.
- id: M7
  title: Migration and release
  goal: Migrate safely and make autonomous work the new-project default.
